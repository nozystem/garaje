<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Garaje</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <!-- Aplica el modo claro u oscuro antes de que arranque la app, para que no
       se vea un instante con el tema equivocado. Misma lógica que ThemeService. -->
  <script>
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('garaje.theme') || 'system'; } catch (e) {}
      var dark = mode === 'dark' ||
        (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('ion-palette-dark');
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
