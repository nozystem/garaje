<button
  type="button"
  class="vehicle"
  [class.vehicle--selected]="selectable() && selected()"
  [attr.aria-pressed]="selectable() ? selected() : null"
  [style.--accent]="vehicle().color || 'var(--ion-color-primary)'"
  (click)="open.emit(vehicle().id)"
>
  <div class="vehicle__art" [class.vehicle__art--white]="!vehicle().photo && vehicle().illustration">
    @if (vehicle().photo) {
      <img [src]="vehicle().photo" alt="" />
    } @else if (vehicle().illustration; as illustration) {
      <app-car-illustration
        [src]="illustration"
        [color]="vehicle().color"
        [version]="vehicle().illustrationVersion"
      ></app-car-illustration>
    } @else {
      <ion-icon name="car-sport-outline" aria-hidden="true"></ion-icon>
    }

    @if (selectable()) {
      <ion-icon
        class="vehicle__check"
        [name]="selected() ? 'checkmark-circle' : 'ellipse-outline'"
        aria-hidden="true"
      ></ion-icon>
    }

    <span class="vehicle__badge">
      @if (overdue() > 0) {
        <ion-badge color="danger">
          {{ (overdue() === 1 ? 'card.overdueOne' : 'card.overdueMany') | t: { n: overdue() } }}
        </ion-badge>
      } @else if (dueSoon() > 0) {
        <ion-badge color="warning">
          {{ (dueSoon() === 1 ? 'card.dueOne' : 'card.dueMany') | t: { n: dueSoon() } }}
        </ion-badge>
      } @else {
        <ion-badge color="success">{{ 'status.ok' | t }}</ion-badge>
      }
    </span>
  </div>

  <div class="vehicle__body">
    <h2 class="vehicle__name">{{ vehicle().nickname }}</h2>
    <p class="vehicle__model">{{ vehicle().make }} {{ vehicle().model }} · {{ vehicle().year }}</p>

    <dl class="stats">
      <div class="stat">
        <dt><ion-icon name="speedometer-outline" [attr.aria-label]="'detail.mileage' | t"></ion-icon></dt>
        <dd>{{ vehicle().mileage | km }}</dd>
      </div>

      @if (next(); as next) {
        <div class="stat">
          <dt><ion-icon name="construct-outline" [attr.aria-label]="'card.next' | t"></ion-icon></dt>
          <dd>
            <span class="stat__title">{{ next.plan.title }}</span>
            <span class="stat__due" [attr.data-status]="next.status | statusColor">{{ nextRemaining() }}</span>
          </dd>
        </div>
        @if (next.estimatedDueDate && next.status !== 'overdue') {
          <div class="stat">
            <dt><ion-icon name="calendar-outline" [attr.aria-label]="'card.nextDate' | t"></ion-icon></dt>
            <dd>{{ next.estimatedDueDate | ldate: 'd MMM y' }}</dd>
          </div>
        }
      } @else {
        <div class="stat stat--muted">
          <dt><ion-icon name="construct-outline" aria-hidden="true"></ion-icon></dt>
          <dd>{{ 'card.noPlans' | t }}</dd>
        </div>
      }
    </dl>
  </div>
</button>
